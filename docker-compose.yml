services:
  backend:
    build:
      context: ./backend
    container_name: starkllm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge_base_data:/kb_data   # Personal Knowledge Base volume
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEFAULT_TEXT_MODEL=qwen3.6:27b
      - DEFAULT_VISION_MODEL=llava
      - DEFAULT_EMBEDDING_MODEL=qwen3-embedding:0.6b
      # Security & Privacy: Disable telemetry globally
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - ANONYMIZED_TELEMETRY=False
      - SECRET_KEY=${SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: starkllm-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  starkllm-data:
