# Alembic configuration file.
# This file controls the migration engine for StarkLLM.

[alembic]
# path to migration scripts, relative to this file's location
script_location = alembic

# SQLite DB path — must match settings.SQLITE_URL in config.py
sqlalchemy.url = sqlite:///./data/starkllm.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
